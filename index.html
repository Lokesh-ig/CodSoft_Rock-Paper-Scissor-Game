<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors - Stylish Responsive Game</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 md:p-6" id="app-body">

  <!-- Top Header Bar (Theme Toggle & Title) -->
  <header class="w-full max-w-md md:max-w-2xl flex items-center justify-between gap-2 mb-3">
    <div>
      <h1 class="text-xl md:text-2xl font-bold tracking-tight text-indigo-400" id="app-title">🎮 Rock • Paper • Scissors</h1>
      <p class="text-xs text-slate-400" id="app-subtitle">Single Player vs CPU Mode</p>
    </div>

    <!-- Theme Toggle Button -->
    <button onclick="toggleTheme()" id="theme-btn" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700 hover:border-slate-500 hover:scale-105 transition-all duration-200 cursor-pointer flex items-center gap-1.5 shadow-sm">
      <span>🌙 Dark Mode</span>
    </button>
  </header>

  <!-- Mode Selector Tabs -->
  <div class="w-full max-w-md md:max-w-2xl bg-slate-800/80 p-1.5 rounded-2xl border border-slate-700 flex gap-1 mb-3" id="mode-selector">
    <button onclick="setMode('1P')" id="btn-1p" class="flex-1 py-2 rounded-xl text-xs md:text-sm font-bold bg-indigo-600 text-white transition-all cursor-pointer shadow">
      👤 1 Player (vs CPU)
    </button>
    <button onclick="setMode('2P')" id="btn-2p" class="flex-1 py-2 rounded-xl text-xs md:text-sm font-bold bg-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 transition-all cursor-pointer">
      👥 2 Players (P1 vs P2)
    </button>
  </div>

  <!-- Scoreboard Dashboard Card -->
  <div class="w-full max-w-md md:max-w-2xl bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-lg mb-3" id="score-card">
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="p-2.5 rounded-xl bg-slate-900/60 border border-emerald-500/30">
        <span class="text-[10px] md:text-xs font-bold text-emerald-400 block" id="lbl-p1-name">PLAYER 1</span>
        <span class="text-2xl md:text-3xl font-bold text-slate-100" id="p1-score">0</span>
      </div>
      <div class="p-2.5 rounded-xl bg-slate-900/60 border border-sky-500/30">
        <span class="text-[10px] md:text-xs font-bold text-sky-400 block">TIES</span>
        <span class="text-2xl md:text-3xl font-bold text-slate-100" id="ties-score">0</span>
      </div>
      <div class="p-2.5 rounded-xl bg-slate-900/60 border border-rose-500/30">
        <span class="text-[10px] md:text-xs font-bold text-rose-400 block" id="lbl-p2-name">CPU</span>
        <span class="text-2xl md:text-3xl font-bold text-slate-100" id="p2-score">0</span>
      </div>
    </div>
  </div>

  <!-- Arena Display Cards -->
  <div class="w-full max-w-md md:max-w-2xl bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-lg mb-3" id="arena-card">
    <div class="grid grid-cols-7 items-center gap-2 mb-3">
      <!-- Player 1 Card -->
      <div class="col-span-3 flex flex-col items-center">
        <span class="text-[10px] md:text-xs font-semibold text-slate-400 mb-1" id="lbl-p1-card-title">YOUR HAND</span>
        <div id="p1-display" class="w-24 h-24 md:w-32 md:h-32 bg-slate-900 border border-slate-700 rounded-2xl flex flex-col items-center justify-center p-2 text-center transition-all shadow-inner">
          <span class="text-3xl md:text-4xl mb-1">❓</span>
          <span class="text-[10px] md:text-xs font-semibold text-slate-400">Select Move</span>
        </div>
      </div>

      <!-- VS Emblem -->
      <div class="col-span-1 text-center">
        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center mx-auto shadow">
          <span class="text-xs md:text-sm font-bold text-indigo-400">VS</span>
        </div>
      </div>

      <!-- Player 2 / CPU Card -->
      <div class="col-span-3 flex flex-col items-center">
        <span class="text-[10px] md:text-xs font-semibold text-slate-400 mb-1" id="lbl-p2-card-title">CPU HAND</span>
        <div id="p2-display" class="w-24 h-24 md:w-32 md:h-32 bg-slate-900 border border-slate-700 rounded-2xl flex flex-col items-center justify-center p-2 text-center transition-all shadow-inner">
          <span class="text-3xl md:text-4xl mb-1">❓</span>
          <span class="text-[10px] md:text-xs font-semibold text-slate-400">CPU Choice</span>
        </div>
      </div>
    </div>

    <!-- Result Banner -->
    <div id="result-banner" class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-2.5 text-center text-xs md:text-sm font-semibold text-slate-200 transition-all">
      Select your move below to start playing!
    </div>
  </div>

  <!-- Move Action Buttons with Hover Effect -->
  <div class="w-full max-w-md md:max-w-2xl grid grid-cols-3 gap-2 md:gap-3 mb-3">
    <button onclick="handleMoveClick('rock')" class="bg-indigo-600 hover:bg-indigo-500 hover:scale-[1.03] hover:shadow-lg text-white font-bold py-3 md:py-4 px-2 rounded-2xl transition-all duration-200 shadow-md active:scale-95 cursor-pointer flex flex-col items-center justify-center">
      <span class="text-2xl md:text-3xl mb-1">🪨</span>
      <span class="text-xs md:text-sm">Rock</span>
    </button>
    <button onclick="handleMoveClick('paper')" class="bg-indigo-600 hover:bg-indigo-500 hover:scale-[1.03] hover:shadow-lg text-white font-bold py-3 md:py-4 px-2 rounded-2xl transition-all duration-200 shadow-md active:scale-95 cursor-pointer flex flex-col items-center justify-center">
      <span class="text-2xl md:text-3xl mb-1">📄</span>
      <span class="text-xs md:text-sm">Paper</span>
    </button>
    <button onclick="handleMoveClick('scissors')" class="bg-indigo-600 hover:bg-indigo-500 hover:scale-[1.03] hover:shadow-lg text-white font-bold py-3 md:py-4 px-2 rounded-2xl transition-all duration-200 shadow-md active:scale-95 cursor-pointer flex flex-col items-center justify-center">
      <span class="text-2xl md:text-3xl mb-1">✂️</span>
      <span class="text-xs md:text-sm">Scissors</span>
    </button>
  </div>

  <!-- Match History Log Table -->
  <div class="w-full max-w-md md:max-w-2xl bg-slate-800/90 border border-slate-700 rounded-2xl p-3 shadow-lg mb-3 overflow-hidden" id="history-card">
    <h3 class="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1">
      <span>📜 Match History Log</span>
    </h3>
    <div class="max-h-36 overflow-y-auto pr-1">
      <table class="w-full text-left text-xs">
        <thead class="text-[10px] uppercase text-slate-400 border-b border-slate-700 sticky top-0 bg-slate-800">
          <tr>
            <th class="py-1 px-1">Rd</th>
            <th class="py-1 px-1">Player 1</th>
            <th class="py-1 px-1">P2 / CPU</th>
            <th class="py-1 px-1">Result</th>
            <th class="py-1 px-1">Details</th>
          </tr>
        </thead>
        <tbody id="history-tbody" class="divide-y divide-slate-700/50 text-slate-300">
          <tr>
            <td colspan="5" class="py-3 text-center text-slate-500 text-[11px]">No rounds played yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bottom Bar Controls -->
  <footer class="w-full max-w-md md:max-w-2xl flex items-center justify-between text-xs pt-1">
    <button onclick="resetGame()" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 hover:scale-105 border border-slate-700 text-slate-300 font-semibold transition-all duration-200 cursor-pointer">
      🔄 Reset Scores & History
    </button>
    <span class="text-slate-500 text-[10px] md:text-xs">CodSoft Task #2 Hover Edition</span>
  </footer>

  <script>
    const choices = ['rock', 'paper', 'scissors'];
    const emojis = { rock: '🪨', paper: '📄', scissors: '✂️' };
    const names = { rock: 'Rock', paper: 'Paper', scissors: 'Scissors' };
    const rules = {
      'rock-scissors': 'Rock smashes Scissors!',
      'scissors-paper': 'Scissors cuts Paper!',
      'paper-rock': 'Paper covers Rock!'
    };

    let mode = '1P';
    let isDark = true;
    let p1Score = 0;
    let p2Score = 0;
    let tiesScore = 0;
    let rounds = 0;
    let isAnimating = false;
    let p1Choice = null;

    function toggleTheme() {
      isDark = !isDark;
      const body = document.getElementById('app-body');
      const themeBtn = document.getElementById('theme-btn');
      
      if (isDark) {
        body.className = 'bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 md:p-6';
        themeBtn.innerHTML = '<span>🌙 Dark Mode</span>';
      } else {
        body.className = 'bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-between p-3 md:p-6';
        themeBtn.innerHTML = '<span>☀️ Light Mode</span>';
      }
    }

    function setMode(newMode) {
      mode = newMode;
      const btn1p = document.getElementById('btn-1p');
      const btn2p = document.getElementById('btn-2p');
      const subTitle = document.getElementById('app-subtitle');
      const p2Name = document.getElementById('lbl-p2-name');
      const p2CardTitle = document.getElementById('lbl-p2-card-title');

      if (mode === '1P') {
        btn1p.className = 'flex-1 py-2 rounded-xl text-xs md:text-sm font-bold bg-indigo-600 text-white transition-all cursor-pointer shadow';
        btn2p.className = 'flex-1 py-2 rounded-xl text-xs md:text-sm font-bold bg-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 transition-all cursor-pointer';
        subTitle.innerText = 'Single Player vs CPU Mode';
        p2Name.innerText = 'CPU';
        p2CardTitle.innerText = 'CPU HAND';
      } else {
        btn2p.className = 'flex-1 py-2 rounded-xl text-xs md:text-sm font-bold bg-indigo-600 text-white transition-all cursor-pointer shadow';
        btn1p.className = 'flex-1 py-2 rounded-xl text-xs md:text-sm font-bold bg-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 transition-all cursor-pointer';
        subTitle.innerText = 'Two Player Pass-and-Play Mode';
        p2Name.innerText = 'PLAYER 2';
        p2CardTitle.innerText = 'PLAYER 2';
      }

      resetGame();
    }

    function handleMoveClick(choice) {
      if (isAnimating) return;

      if (mode === '1P') {
        // Single Player vs CPU
        isAnimating = true;
        document.getElementById('p1-display').innerHTML = `
          <span class="text-4xl md:text-5xl mb-1">${emojis[choice]}</span>
          <span class="text-xs font-bold text-emerald-400">${names[choice]}</span>
        `;

        let shuffleStep = 0;
        const shuffleInterval = setInterval(() => {
          const randChoice = choices[Math.floor(Math.random() * choices.length)];
          document.getElementById('p2-display').innerHTML = `
            <span class="text-3xl md:text-4xl mb-1 opacity-60">${emojis[randChoice]}</span>
            <span class="text-[10px] text-slate-400">Thinking...</span>
          `;
          shuffleStep++;
          if (shuffleStep >= 6) {
            clearInterval(shuffleInterval);
            const cpuChoice = choices[Math.floor(Math.random() * choices.length)];
            finalizeRound(choice, cpuChoice);
            isAnimating = false;
          }
        }, 70);
      } else {
        // Two Player Pass-and-Play
        if (!p1Choice) {
          p1Choice = choice;
          document.getElementById('p1-display').innerHTML = `
            <span class="text-4xl mb-1">🔒</span>
            <span class="text-xs font-bold text-indigo-400">Locked</span>
          `;
          document.getElementById('result-banner').innerText = 'Player 1 move locked! Player 2: Select your move below.';
        } else {
          const p2Choice = choice;
          finalizeRound(p1Choice, p2Choice);
          p1Choice = null;
        }
      }
    }

    function finalizeRound(c1, c2) {
      rounds++;

      document.getElementById('p1-display').innerHTML = `
        <span class="text-4xl md:text-5xl mb-1">${emojis[c1]}</span>
        <span class="text-xs font-bold text-emerald-400">${names[c1]}</span>
      `;

      document.getElementById('p2-display').innerHTML = `
        <span class="text-4xl md:text-5xl mb-1">${emojis[c2]}</span>
        <span class="text-xs font-bold text-rose-400">${names[c2]}</span>
      `;

      let outcomeText = '';
      let outcomeBadge = '';

      if (c1 === c2) {
        tiesScore++;
        outcomeText = `🤝 IT'S A TIE! Both chose ${names[c1]}.`;
        outcomeBadge = 'TIE';
      } else if (rules[`${c1}-${c2}`]) {
        p1Score++;
        const exp = rules[`${c1}-${c2}`];
        outcomeText = mode === '1P' ? `🎉 YOU WIN ROUND ${rounds}! ${exp}` : `🎉 PLAYER 1 WINS ROUND ${rounds}! ${exp}`;
        outcomeBadge = 'P1 WIN';
      } else {
        p2Score++;
        const exp = rules[`${c2}-${c1}`];
        outcomeText = mode === '1P' ? `💥 CPU WINS ROUND ${rounds}! ${exp}` : `🎉 PLAYER 2 WINS ROUND ${rounds}! ${exp}`;
        outcomeBadge = mode === '1P' ? 'CPU WIN' : 'P2 WIN';
      }

      document.getElementById('p1-score').innerText = p1Score;
      document.getElementById('p2-score').innerText = p2Score;
      document.getElementById('ties-score').innerText = tiesScore;

      document.getElementById('result-banner').innerText = outcomeText;

      addHistoryRow(rounds, `${names[c1]} ${emojis[c1]}`, `${names[c2]} ${emojis[c2]}`, outcomeBadge, outcomeText);
    }

    function addHistoryRow(rd, p1Move, p2Move, result, details) {
      const tbody = document.getElementById('history-tbody');
      if (rd === 1) tbody.innerHTML = '';

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-700/40 transition-colors';
      tr.innerHTML = `
        <td class="py-1.5 px-1 font-bold">${rd}</td>
        <td class="py-1.5 px-1 text-emerald-400 font-semibold">${p1Move}</td>
        <td class="py-1.5 px-1 text-rose-400 font-semibold">${p2Move}</td>
        <td class="py-1.5 px-1 font-bold">${result}</td>
        <td class="py-1.5 px-1 text-slate-400 truncate max-w-[120px]">${details}</td>
      `;
      tbody.insertBefore(tr, tbody.firstChild);
    }

    function resetGame() {
      p1Score = 0;
      p2Score = 0;
      tiesScore = 0;
      rounds = 0;
      p1Choice = null;
      isAnimating = false;

      document.getElementById('p1-score').innerText = 0;
      document.getElementById('p2-score').innerText = 0;
      document.getElementById('ties-score').innerText = 0;

      document.getElementById('p1-display').innerHTML = `
        <span class="text-3xl md:text-4xl mb-1">❓</span>
        <span class="text-[10px] md:text-xs font-semibold text-slate-400">Select Move</span>
      `;

      const p2Label = mode === '1P' ? 'CPU Choice' : 'Player 2';
      document.getElementById('p2-display').innerHTML = `
        <span class="text-3xl md:text-4xl mb-1">❓</span>
        <span class="text-[10px] md:text-xs font-semibold text-slate-400">${p2Label}</span>
      `;

      document.getElementById('result-banner').innerText = 'Select your move below to start playing!';
      document.getElementById('history-tbody').innerHTML = `
        <tr>
          <td colspan="5" class="py-3 text-center text-slate-500 text-[11px]">No rounds played yet.</td>
        </tr>
      `;
    }
  </script>
</body>
</html>
